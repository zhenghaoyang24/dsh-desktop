appId: github.zhenghaoyang24.dsh-desktop
productName: dsh-desktop
directories:
  output: build
files:
  - main.js
  - preload.js
  - src/**
  - renderer/**
  - package.json
  - buildResources/logo*.png
  - buildResources/icon.ico
# 界面只使用中/英，只打包这两种 Chromium 内置资源，去掉其余 50+ 语言包
electronLanguages:
  - zh-CN
  - en-US
win:
  icon: buildResources/icon.png
  target:
    - zip
    - portable
  artifactName: "dsh-desktop-${version}-windows-x64.${ext}"
portable:
  artifactName: "dsh-desktop-${version}-windows-x64.exe"
